name: Kabuzidou Evening Review

on:
  schedule:
    # UTC 08:13 = 平日 17:13 JST（この時刻はUTC/JSTで日付またぎがないため曜日はそのままでよい）
    - cron: "13 8 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  evening-review:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run evening review
        shell: powershell
        env:
          KABU_SMTP_USER: ${{ secrets.KABU_SMTP_USER }}
          KABU_SMTP_PASS: ${{ secrets.KABU_SMTP_PASS }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: .\scripts\Get-EveningReview.ps1

      - name: Persist state
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/
          $changed = git status --porcelain
          if ($changed) {
            git commit -m "chore: update kabuzidou state [skip ci]"
            git pull --rebase
            git push
          } else {
            Write-Host "No state changes."
          }
