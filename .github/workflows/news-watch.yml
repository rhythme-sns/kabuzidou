name: Kabuzidou News Watch

on:
  schedule:
    # いずれもUTC。平日 8:30-15:30 JST を15分おきにカバー（JST = UTC+9）。
    - cron: "30,45 23 * * 0-4"   # JST 8:30 / 8:45 (月-金)
    - cron: "*/15 0-5 * * 1-5"   # JST 9:00-14:45 (月-金)
    - cron: "0,15,30 6 * * 1-5"  # JST 15:00-15:30 (月-金)
  workflow_dispatch: {}

concurrency:
  group: kabuzidou-news-watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  news-watch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run news watch
        shell: powershell
        env:
          KABU_SMTP_USER: ${{ secrets.KABU_SMTP_USER }}
          KABU_SMTP_PASS: ${{ secrets.KABU_SMTP_PASS }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: .\scripts\Watch-News.ps1

      - name: Persist state
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/
          $changed = git status --porcelain
          if ($changed) {
            git commit -m "chore: update kabuzidou state [skip ci]"
            git pull --rebase
            git push
          } else {
            Write-Host "No state changes."
          }
